[project]
name = "financial-stock-agent"
description = "A agent to facilitate querying and processing finance data."
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "John K. Lee", email = "puremonkey2007@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
keywords = ["finance", "agent", "stock-market", "taiwan", "yfinance"]
dependencies = [
    "html5lib>=1.1",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
    "lxml>=6.1.1",
    "matplotlib>=3.10.9",
    "pandas<3.0.0",
    "pandas-datareader>=0.10.0",
    "playwright>=1.60.0",
    "plotly>=6.8.0",
    "twstock>=1.5.1",
    "yfinance>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/johnklee/finance_agent"
Repository = "https://github.com/johnklee/finance_agent"
Issues = "https://github.com/johnklee/finance_agent/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["finance_agent"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/labs",
    "/conductor",
]

[tool.hatch.version]
path = "finance_agent/__init__.py"

[tool.ruff]
indent-width = 2

[tool.ruff.format]
indent-style = "space"
